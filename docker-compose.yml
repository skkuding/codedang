# NOTE: This docker-compose file is for local development environment only.

services:
  app:
    profiles: ['devcontainer']
    container_name: codedang-dev
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    depends_on:
      - rabbitmq
      - database
    stdin_open: true
    tty: true
    environment:
      DEVCONTAINER: '1'
    network_mode: host
    privileged: true
    cgroup: host

  storage:
    container_name: codedang-storage
    image: minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 'skku'
      MINIO_ROOT_PASSWORD: 'skku1234'
    volumes:
      - codedang-storage:/data

  database:
    container_name: codedang-database
    image: postgres:16-alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: 'skkuding'
    volumes:
      - codedang-database:/var/lib/postgresql/data

  test-database:
    container_name: codedang-test-database
    image: postgres:16-alpine
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: '1234'
      POSTGRES_DB: 'skkuding'
    volumes:
      - codedang-test-database:/var/lib/postgresql/data

  cache:
    container_name: codedang-cache
    image: redis:7-alpine
    ports:
      - 6380:6379
    command: redis-server --requirepass ${REDIS_PASSWORD}

  rabbitmq:
    container_name: codedang-rabbitmq
    image: rabbitmq:3.13-management-alpine
    ports:
      - 15672:15672 # Admin Management
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: 'skku'
      RABBITMQ_DEFAULT_PASS: '1234'
      RABBITMQ_DEFAULT_VHOST: 'vh'
    volumes:
      - codedang-rabbitmq:/var/lib/rabbitmq

  otel-collector:
    profiles: ['observability']
    container_name: codedang-otel-collector
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - 4317:4317 # OTLP gRPC
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  tempo:
    profiles: ['observability']
    container_name: codedang-tempo
    # 클러스터의 tempo helm chart 1.24.0과 같은 2.8 계열로 맞춘다.
    # 3.x는 설정 스키마가 달라 이 설정 파일이 파싱되지 않는다.
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - 3200:3200 # Tempo HTTP API
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - codedang-tempo:/var/tempo

volumes:
  codedang-storage:
  codedang-database:
  codedang-test-database:
  codedang-rabbitmq:
  codedang-tempo:
