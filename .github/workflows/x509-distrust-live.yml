# Live TLS handshakes against the eMudhra disclosure site's test hosts.
#
# This is a temporary rollout check, not a required CI gate: it depends on a
# third-party site and on test leaves that expire on 2027-05-03. The durable
# guards are the offline x509 tests and the toolchain checks in ci.yml and the
# CD workflows.
#
# Remove this workflow (and tests/x509-distrust/node.live.test.mjs) once the
# patched images are verified in production and n8n runs a patched Node, and
# no later than 2027-05-03.
name: x509 Distrust (Live)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  test-live:
    name: Test x509 Distrust (Live, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.4', '24.22.1', '26.12.1']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test live handshakes
        env:
          X509_DISTRUST_LIVE: '1'
        run: node --test tests/x509-distrust/node.live.test.mjs
