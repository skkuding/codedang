# This workflow only builds and pushes Docker images.
# The rest of the deployment process is handled by ArgoCD.
name: CD - Stage

on:
  push:
    branches: [main, hotfix-cd-stage]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - target: client-api
            file: ./apps/backend/Dockerfile
            context: .
            binary: ''
            ca_family: ''
            node_check: true
            build-args: |
              target=client
              app_env=stage
          - target: admin-api
            file: ./apps/backend/Dockerfile
            context: .
            binary: ''
            ca_family: ''
            node_check: true
            build-args: |
              target=admin
              app_env=stage
          - target: iris
            file: ''
            context: apps/iris
            binary: /iris
            ca_family: ubuntu
            node_check: false
            build-args: |
              app_env=stage
          - target: plag
            file: ''
            context: apps/plag
            binary: /plag
            ca_family: ubuntu
            node_check: false
            build-args: |
              app_env=stage
          - target: runner-pod-manager
            file: ''
            context: apps/runner/pod-manager
            binary: /app/pod-manager
            ca_family: alpine
            node_check: false
            build-args: ''
          - target: runner
            file: ''
            context: apps/runner/backend
            binary: /app/server
            ca_family: ubuntu
            node_check: false
            build-args: ''

    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ArgoCD Image Updater follows the :stage tag, so push only the commit tag
      # here and move :stage after the image passes verification.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.target.file }}
          context: '{{defaultContext}}:${{ matrix.target.context }}'
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          build-args: ${{ matrix.target.build-args }}
          tags: |
            ghcr.io/skkuding/codedang-${{ matrix.target.target }}:${{ github.sha }}

      - name: Set up Go for provenance check
        if: matrix.target.binary != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'

      - name: Verify Go binary provenance
        if: matrix.target.binary != ''
        run: |
          ./scripts/verify-go-image.sh \
            "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:${{ github.sha }}" \
            "${{ matrix.target.binary }}" \
            go1.27.3

      - name: Verify trust store
        if: matrix.target.ca_family != ''
        run: |
          ./scripts/verify-ca-certificates.sh \
            "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:${{ github.sha }}" \
            "${{ matrix.target.ca_family }}"

      - name: Verify Node.js runtime
        if: matrix.target.node_check
        run: |
          ./scripts/verify-node-image.sh \
            "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:${{ github.sha }}"

      - name: Promote verified image
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:stage" \
            -t "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:latest" \
            "ghcr.io/skkuding/codedang-${{ matrix.target.target }}:${{ github.sha }}"

  build-frontend:
    name: Build and Push Image (Frontend)
    runs-on: arc-runner

    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha
            });
            const num = res.data?.[0]?.number || '';
            core.setOutput('number', String(num));

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          file: ./apps/frontend/Dockerfile
          context: '{{defaultContext}}:.'
          cache-from: |
            type=registry,ref=ghcr.io/skkuding/codedang-frontend:cache-${{ steps.pr.outputs.number || 'stage' }}
            type=registry,ref=ghcr.io/skkuding/codedang-frontend:cache-stage
          cache-to: type=registry,ref=ghcr.io/skkuding/codedang-frontend:cache-stage
          push: true
          build-args: |
            BASEURL=https://stage.codedang.com/api
            GQL_BASEURL=https://stage.codedang.com/graphql
            RUNNER_BASEURL=wss://run.stage.codedang.com/run
            ADMIN_REST_URL=https://stage.codedang.com/admin-api
          # :stage and :latest are added by verify-frontend after verification.
          tags: |
            ghcr.io/skkuding/codedang-frontend:${{ github.sha }}

  verify-frontend:
    name: Verify and Promote Frontend Image
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Node.js runtime
        run: |
          ./scripts/verify-node-image.sh \
            "ghcr.io/skkuding/codedang-frontend:${{ github.sha }}"

      - name: Promote verified image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/skkuding/codedang-frontend:stage \
            -t ghcr.io/skkuding/codedang-frontend:latest \
            "ghcr.io/skkuding/codedang-frontend:${{ github.sha }}"
