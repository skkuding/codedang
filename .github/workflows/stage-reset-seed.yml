name: Reset Seed (Stage)

on: workflow_dispatch

jobs:
  reset-seed:
    name: Reset Seed (Stage)
    runs-on: self-hosted
    steps:
      - name: Reset and Seed Stage Database
        # Use the existing container's environment for both commands.
        run: docker exec backend-client sh -ec 'npx prisma migrate reset --force && npx prisma db seed'
