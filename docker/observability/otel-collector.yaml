# 로컬 개발용 OpenTelemetry Collector 설정.
# 클러스터 설정(infra/k8s/monitoring/otel-collector/otel-collector.yaml)과
# 파이프라인 구성을 맞추되, 로컬에서는 debug exporter로 stdout에 바로 출력한다.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    # 로컬에서는 바로 보이는 것이 중요하므로 클러스터(10s/512)보다 짧게 잡는다.
    timeout: 1s
    send_batch_size: 64

exporters:
  debug:
    verbosity: detailed
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # 로컬 Loki는 auth_enabled: false 라 클러스터와 달리 X-Scope-OrgID가 필요 없다.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  # Prometheus가 이 포트를 스크랩한다. 설정은 클러스터와 같다.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  # collector 자체 메트릭을 Prometheus가 스크랩할 수 있게 노출한다.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlphttp/loki]
