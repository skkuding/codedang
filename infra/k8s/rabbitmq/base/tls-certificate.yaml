apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-server-cert
  namespace: rabbitmq
spec:
  secretName: rabbitmq-server-certs
  issuerRef:
    name: rabbitmq-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - rabbitmq.rabbitmq.svc.cluster.local
    - rabbitmq.rabbitmq.svc
    - rabbitmq
  duration: 8760h
  renewBefore: 720h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: rabbitmq-ca
  secretName: rabbitmq-ca-secret
  duration: 8770h
  renewBefore: 720h
  issuerRef:
    name: rabbitmq-selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-ca-issuer
spec:
  ca:
    secretName: rabbitmq-ca-secret