apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-server-cert
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  secretName: rabbitmq-server-certs
  issuerRef:
    name: rabbitmq-intermediate-ca-issuer
    kind: ClusterIssuer
  dnsNames:
    - rabbitmq.rabbitmq.svc.cluster.local
    - rabbitmq.rabbitmq.svc
    - rabbitmq
  duration: 2160h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
