# This policy refers to tls-certifiate.yaml
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: rabbitmq-backend-tls-policy
  namespace: rabbitmq
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: rabbitmq
  validation:
    hostname: rabbitmq.rabbitmq.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: rabbitmq-server-certs