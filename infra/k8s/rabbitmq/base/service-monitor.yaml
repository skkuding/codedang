apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-monitor
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: '4'
  labels:
    release: prometheus # release name of kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - rabbitmq
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
      app.kubernetes.io/name: rabbitmq
  endpoints:
    - port: prometheus-tls
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      interval: 15s
