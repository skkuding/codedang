apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: admin-user
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  tags:
    - administrator
  rabbitmqClusterReference:
    name: rabbitmq
  importCredentialsSecret:
    name: admin-credentials
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: admin-user-permission
  namespace: rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  vhost: 'vh'
  user: 'admin'
  permissions:
    write: '.*'
    configure: '.*'
    read: '.*'
  rabbitmqClusterReference:
    name: rabbitmq
