apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-selfsigned-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-root-ca-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ca:
    secretName: rabbitmq-root-ca-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: rabbitmq-intermediate-ca-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  ca:
    secretName: rabbitmq-intermediate-ca-secret
