# cert-manager Helm chart values
# https://artifacthub.io/packages/helm/cert-manager/cert-manager

# enable gateway api for ingress to gateway migration
config:
  enableGatewayAPI: true

# Install CRDs with Helm
crds:
  enabled: true

replicaCount: 1

# Enable prometheus metrics
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: prometheus
