apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  external:
    url: http://grafana.monitoring-grafana.svc.cluster.local
    adminUser:
      name: grafana-admin-user
      key: ADMIN_USER
    adminPassword:
      name: grafana-admin-user
      key: ADMIN_PASSWORD
