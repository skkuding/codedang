apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: ai-agent
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceName: grafana
  name: ai-agent
  role: Viewer
  tokens:
    - name: ai-agent
      secretName: grafana-ai-agent-token
