apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-minio

resources:
  - ../../base
  - tenant-config.yaml
  - users.yaml

patches:
  - path: tenant-node.yaml
    target:
      kind: Tenant
      name: minio
  - path: tenant-image.yaml
    target:
      kind: Tenant
      name: minio
