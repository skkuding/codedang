# For full example, check below:
# https://github.com/minio/operator/blob/master/examples/kustomization/base/tenant.yaml
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: monitoring-minio
  labels:
    app: minio
spec:
  # MinIO no longer publishes server images, so the operator's default minio/minio image can no
  # longer be pulled. Run PGSTY Silo (MinIO fork, drop-in compatible) RELEASE.2026-08-06T00-00-00Z,
  # the same digest as stage's silo-shadow (infra/k8s/minio/silo-statefulset.yaml).
  image: docker.io/pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
  features:
    bucketDNS: false # use path-style access to be compatible with Loki/Tempo/Pyroscope S3 config
  users:
    - name: monitoring-user
  buckets:
    - name: 'loki'
      region: 'ap-northeast-2'
      objectLock: false
    - name: 'tempo'
      region: 'ap-northeast-2'
      objectLock: false
    - name: 'pyroscope'
      region: 'ap-northeast-2'
      objectLock: false
  configuration:
    name: tenant-config
  env:
    - name: MINIO_BROWSER_REDIRECT_URL
      value: 'https://monitoring.minio.codedang.com'
  pools:
    - servers: 1 # standalone mode (4 or more for distributed mode)
      name: pool-0
      volumesPerServer: 1
      volumeClaimTemplate:
        apiVersion: v1
        kind: PersistentVolumeClaim
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 100Gi
          storageClassName: local-path
  requestAutoCert: false # Use custom ingress instead
