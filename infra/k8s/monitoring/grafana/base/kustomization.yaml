apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-grafana

resources:
  - namespace.yaml

configMapGenerator:
  - name: grafana-rabbitmq-queues
    files:
      - dashboards/rabbitmq-queues.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: '1'
