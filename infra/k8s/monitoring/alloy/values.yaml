# This collector pulls pprof profiles from Iris Pods and watches cluster-wide
# Kubernetes Events.
crds:
  create: false

controller:
  type: deployment
  replicas: 1

rbac:
  namespaces:
    - iris
  rules:
    - apiGroups: ['']
      resources: ['pods']
      verbs: ['get', 'list', 'watch']
  # The chart renders either namespaced Roles or a ClusterRole, never both, and
  # drops clusterRules while namespaces is set. Event RBAC is in extraObjects.
  clusterRules: []

extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: '{{ include "alloy.fullname" . }}-events'
    rules:
      - apiGroups: ['']
        resources: ['events']
        verbs: ['get', 'list', 'watch']
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: '{{ include "alloy.fullname" . }}-events'
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: '{{ include "alloy.fullname" . }}-events'
    subjects:
      - kind: ServiceAccount
        name: '{{ include "alloy.serviceAccountName" . }}'
        namespace: '{{ include "alloy.namespace" . }}'

alloy:
  enableReporting: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configMap:
    content: |-
      discovery.kubernetes "iris_pods" {
        role = "pod"

        namespaces {
          names = ["iris"]
        }

        selectors {
          role  = "pod"
          label = "app in (iris,iris-test,iris-rejudge)"
        }
      }

      discovery.relabel "iris_pprof" {
        targets = discovery.kubernetes.iris_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_ready"]
          regex         = "true"
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "iris"
          action        = "keep"
        }

        // iris-test and iris-rejudge also listen on 6060 but do not declare it as a container port.
        rule {
          source_labels = ["__meta_kubernetes_pod_ip"]
          regex         = "(.+)"
          replacement   = "${1}:6060"
          target_label  = "__address__"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "service_name"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      pyroscope.scrape "iris" {
        targets                  = discovery.relabel.iris_pprof.output
        forward_to               = [pyroscope.write.local.receiver]
        scrape_interval          = "60s"
        scrape_timeout           = "20s"
        delta_profiling_duration = "10s"

        profiling_config {
          profile.block {
            enabled = false
          }
          profile.mutex {
            enabled = false
          }
        }
      }

      pyroscope.write "local" {
        endpoint {
          url = "http://pyroscope.monitoring-pyroscope.svc.cluster.local:4040"
        }

        external_labels = {
          environment = "{{ .Values.environment }}",
        }
      }

      loki.source.kubernetes_events "cluster" {
        forward_to = [loki.write.loki.receiver]
        job_name   = "kubernetes-events"
        log_format = "json"
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring-loki.svc.cluster.local:3100/loki/api/v1/push"
        }

        external_labels = {
          environment = "{{ .Values.environment }}",
        }
      }

serviceMonitor:
  enabled: true
  additionalLabels:
    release: prometheus
