apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: simplest
  namespace: monitoring-otel
spec:
  # Pin the contrib distribution. It is the only published distribution that
  # carries both the prometheus exporter and the k8sattributes processor.
  # (core has no k8sattributes, k8s has no prometheus exporter.)
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.145.0
  # prometheus will scrape through this port
  ports:
    - name: metrics
      port: 8889
      targetPort: 8889
      protocol: TCP
      appProtocol: http
  config:
    # https://opentelemetry.io/docs/collector/architecture/
    # https://opentelemetry.io/docs/collector/configuration/
    receivers:
      otlp: # push
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      # Telemetry arrives with the Pod name only as host.name. This resolves the
      # sending Pod by the source IP of the OTLP connection and attaches the
      # standard Kubernetes resource attributes. It has to run before batch,
      # which drops the per-connection client information it relies on.
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.deployment.name
        pod_association:
          - sources:
              - from: connection
      batch:
        timeout: 10s
        send_batch_size: 512
    exporters:
      otlphttp/logs:
        endpoint: http://loki.monitoring-loki.svc.cluster.local:3100/otlp
        tls:
          insecure: true
        # used to satisfy loki's multi-tenancy
        headers:
          X-Scope-OrgID: '1'
      prometheus:
        endpoint: '0.0.0.0:8889'
        resource_to_telemetry_conversion:
          enabled: true
      otlp/trace:
        endpoint: 'tempo.monitoring-tempo.svc.cluster.local:4317'
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlphttp/logs]
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp/trace]
