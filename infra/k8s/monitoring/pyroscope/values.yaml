# Pyroscope v2 single-binary backend. Alloy is deployed separately in the next step.
architecture:
  storage:
    v1: false
    v2: true
  microservices:
    enabled: false

alloy:
  enabled: false
agent:
  enabled: false
minio:
  enabled: false

pyroscope:
  replicaCount: 1
  extraArgs:
    log.level: info
    config.expand-env: 'true'
    metastore.index.cleanup-interval: 15m
  extraEnvFrom:
    - secretRef:
        name: monitoring-user
  # The MinIO Tenant creates buckets only during initial provisioning. Also
  # create the bucket when adding Pyroscope to an already running tenant.
  # MinIO no longer publishes minio/mc images, so use the AWS CLI instead.
  initContainers:
    - name: create-profile-bucket
      image: public.ecr.aws/aws-cli/aws-cli:2.37.9
      command: ['/bin/sh', '-ec']
      args:
        - |
          export AWS_ACCESS_KEY_ID="$CONSOLE_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$CONSOLE_SECRET_KEY"
          if aws s3api head-bucket --bucket pyroscope 2>/dev/null; then
            echo 'Bucket pyroscope already exists'
          else
            aws s3api create-bucket --bucket pyroscope
          fi
      envFrom:
        - secretRef:
            name: monitoring-user
      env:
        - name: AWS_ENDPOINT_URL
          value: http://minio.monitoring-minio.svc.cluster.local:80
        - name: AWS_REGION
          value: us-east-1
        - name: HOME
          value: /tmp
  persistence:
    enabled: true # Pyroscope v2 metastore Raft state must survive Pod restarts.
    size: 10Gi
    storageClassName: local-path
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi
  structuredConfig:
    storage:
      backend: s3
      s3:
        bucket_name: pyroscope
        endpoint: minio.monitoring-minio.svc.cluster.local:80
        insecure: true
        bucket_lookup_type: path-style
        access_key_id: ${CONSOLE_ACCESS_KEY}
        secret_access_key: ${CONSOLE_SECRET_KEY}
