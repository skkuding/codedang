apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-api-server-gateway
spec:
  parentRefs:
  - name: main-gateway
    namespace: kube-system
    sectionName: https
  hostnames:
  - codedang.com
  rules:
  - matches:
    - path:
        type: Prefix
        value: /graphql
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: admin-api-cors
    backendRefs:
    - name: admin-api-server
      port: 3000

  - matches:
    - path:
        type: Prefix
        value: /admin-api
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: admin-api-cors
    backendRefs:
    - name: admin-api-server
      port: 3000
