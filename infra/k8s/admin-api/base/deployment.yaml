apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: admin-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: admin-api
          image: ghcr.io/skkuding/codedang-admin-api
          resources:
            limits:
              cpu: 1
              memory: 1.5Gi
            requests:
              cpu: 0.2
              memory: 200Mi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 3000
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
          envFrom:
            - configMapRef:
                name: admin-api-env
            - secretRef:
                name: aws-credentials
            - secretRef:
                name: database-credentials
            - secretRef:
                name: security-keys
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password

          volumeMounts:
            - name: rabbitmq-ca
              mountPath: /etc/codedang/certs
              readOnly: true

      volumes:
        - name: rabbitmq-ca
          configMap:
            name: rabbitmq-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
