apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rabbitmq-cluster-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - env: stage
          - env: production
  template:
    metadata:
      name: 'rabbitmq-cluster-operator-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '-1'
      labels:
        app.kubernetes.io/environment: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rabbitmq/cluster-operator
        targetRevision: v2.19.1
        path: config/installation
      destination:
        namespace: rabbitmq-system
        name: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rabbitmq-topology-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - env: stage
          - env: production
  template:
    metadata:
      name: 'rabbitmq-topology-operator-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '-1'
      labels:
        app.kubernetes.io/environment: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rabbitmq/messaging-topology-operator
        targetRevision: v1.18.3
        path: config/installation/cert-manager
        kustomize:
          patches:
            - target:
                kind: Namespace
                name: rabbitmq-system
              patch: |-
                - op: add
                  path: /metadata/labels/trust.codedang.com~1rabbitmq
                  value: 'true'
            - target:
                kind: Deployment
                name: messaging-topology-operator
              patch: |-
                - op: add
                  path: /spec/template/spec/containers/0/volumeMounts/-
                  value:
                    mountPath: /etc/ssl/certs/rabbitmq-ca.crt
                    name: rabbitmq-ca
                    readOnly: true
                    subPath: ca.crt
                - op: add
                  path: /spec/template/spec/volumes/-
                  value:
                    configMap:
                      name: rabbitmq-ca-cert
                    name: rabbitmq-ca
      destination:
        namespace: rabbitmq-system
        name: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
