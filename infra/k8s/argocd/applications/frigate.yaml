apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate-stage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/environment: 'stage'
spec:
  project: default

  source:
    repoURL: https://github.com/skkuding/codedang
    targetRevision: main
    path: infra/k8s/frigate/overlays/stage

  destination:
    name: stage
    namespace: frigate

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
