apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pyroscope
  namespace: argocd
spec:
  syncPolicy:
    preserveResourcesOnDeletion: true
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - env: stage
            branch: main
          - env: production
            branch: release
  template:
    metadata:
      name: 'pyroscope-{{.env}}'
      labels:
        app.kubernetes.io/environment: '{{.env}}'
    spec:
      project: default
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: pyroscope
          targetRevision: '2.3.1'
          helm:
            releaseName: pyroscope
            valueFiles:
              - '$codedang/infra/k8s/monitoring/pyroscope/values.yaml'
              - '$codedang/infra/k8s/monitoring/pyroscope/values-{{.env}}.yaml'
        - repoURL: https://github.com/skkuding/codedang
          targetRevision: '{{.branch}}'
          ref: codedang
      destination:
        name: '{{.env}}'
        namespace: monitoring-pyroscope
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
