# trust-manager file for rabbitmq
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: trust-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - env: stage
          - env: production
  template:
    metadata:
      name: 'trust-manager-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '-2'
      labels:
        app.kubernetes.io/environment: '{{.env}}'
    spec:
      project: default
      source:
        repoURL: https://charts.jetstack.io
        chart: trust-manager
        targetRevision: 'v0.24.0'
        helm:
          releaseName: trust-manager
          values: |
            crds:
              enabled: true
            app:
              trust:
                namespace: cert-manager
      destination:
        namespace: cert-manager
        name: '{{.env}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
