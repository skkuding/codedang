# External Secrets Operator (ESO) for production.
# The production overlays of admin-api, client-api, iris and plag define a SecretStore and an
# ExternalSecret that copy the database URL from AWS Secrets Manager (Codedang-Database-Secret).
# Those kinds come from this operator. On the old k3s cluster it was installed by hand with
# `helm install`, so the rebuilt kubeadm cluster did not have it. Stage does not use ESO.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-production
  namespace: argocd
  annotations:
    # Before the apps that create SecretStore/ExternalSecret resources
    argocd.argoproj.io/sync-wave: '-2'
  labels:
    app.kubernetes.io/environment: 'production'
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Same version as the old k3s cluster (v0.18.1, chart defaults); serves external-secrets.io/v1.
    targetRevision: 0.18.1
    helm:
      releaseName: external-secrets
  destination:
    namespace: external-secrets
    name: production
  # The cert-controller injects the webhook CA bundle at runtime.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  syncPolicy:
    automated:
      # Prune disabled: requires manual review before removing resources
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # ESO CRDs are too large for client-side apply annotations
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
