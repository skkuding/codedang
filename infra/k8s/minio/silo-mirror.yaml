apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo-mirror
  namespace: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silo-mirror
  template:
    metadata:
      labels:
        app: silo-mirror
    spec:
      initContainers:
        - name: bootstrap
          image: docker.io/pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
          command:
            - /bin/sh
            - /scripts/bootstrap.sh
          envFrom:
            - secretRef:
                name: silo-root-credentials
          volumeMounts: &migration-volume-mounts
            - name: scripts
              mountPath: /scripts
            - name: source-config
              mountPath: /source
              readOnly: true
            - name: admin-api-user
              mountPath: /users/admin-api
              readOnly: true
            - name: client-api-user
              mountPath: /users/client-api
              readOnly: true
            - name: iris-user
              mountPath: /users/iris
              readOnly: true
            - name: plag-user
              mountPath: /users/plag
              readOnly: true
            - name: migration-credentials
              mountPath: /migration
              readOnly: true
      containers:
        - name: testcase
          image: docker.io/pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
          command: ['/bin/sh', '/scripts/mirror.sh', 'codedang-testcase']
          volumeMounts: &mirror-volume-mounts
            - name: scripts
              mountPath: /scripts
            - name: migration-credentials
              mountPath: /migration
              readOnly: true
          resources: &mirror-resources
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: media
          image: docker.io/pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
          command: ['/bin/sh', '/scripts/mirror.sh', 'codedang-media']
          volumeMounts: *mirror-volume-mounts
          resources: *mirror-resources
        - name: plag-checks
          image: docker.io/pgsty/silo@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
          command: ['/bin/sh', '/scripts/mirror.sh', 'codedang-plag-checks']
          volumeMounts: *mirror-volume-mounts
          resources: *mirror-resources
      volumes:
        - name: scripts
          configMap:
            name: silo-migration
            defaultMode: 0555
        - name: source-config
          secret:
            secretName: tenant-config
        - name: admin-api-user
          secret:
            secretName: admin-api-user
        - name: client-api-user
          secret:
            secretName: client-api-user
        - name: iris-user
          secret:
            secretName: iris-user
        - name: plag-user
          secret:
            secretName: plag-user
        - name: migration-credentials
          secret:
            secretName: silo-migration-credentials
