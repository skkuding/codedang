apiVersion: v1
kind: Service
metadata:
  name: silo-shadow-headless
  namespace: minio
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: silo-shadow
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: silo-shadow
  namespace: minio
spec:
  selector:
    app: silo-shadow
  ports:
    - name: api
      port: 80
      targetPort: api
    - name: console
      port: 9090
      targetPort: console
