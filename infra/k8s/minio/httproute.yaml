apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-httproute
  namespace: minio
spec:
  parentRefs:
    - name: main-gateway
      namespace: kube-system
      sectionName: https-stage-wildcard
  hostnames:
    - minio.stage.codedang.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silo-shadow
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
