# Application object storage for stage. The legacy MinIO Tenant was removed
# after the cutover to Silo; the Silo StatefulSet and the application
# credentials remain here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: minio

resources:
  - httproute.yaml
  - namespace.yaml
  - silo-pvc.yaml
  - silo-root-credentials.yaml
  - silo-services.yaml
  - silo-statefulset.yaml
  - silo-storage-class.yaml
  - users/admin-api.yaml
  - users/client-api.yaml
  - users/iris.yaml
  - users/plag.yaml
