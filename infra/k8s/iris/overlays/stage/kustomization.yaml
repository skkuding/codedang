apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iris

resources:
  - ../../base
  - aws-credentials.yaml
  - database-credentials.yaml
  - pprof-basicauth.yaml
  - pprof-basicauth-credential.yaml
  - pprof-client.yaml

replicas:
  - name: iris
    count: 2

patches:
  - path: configmap.yaml
    target:
      kind: ConfigMap
      name: iris-env
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: iris
  - path: httproute.yaml
    target:
      kind: HTTPRoute
      name: iris-pprof-httproute
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: iris-test
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: iris-rejudge
