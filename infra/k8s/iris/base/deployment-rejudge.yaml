apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-rejudge
  namespace: iris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-rejudge
  template:
    metadata:
      labels:
        app: iris-rejudge
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: iris-rejudge
      containers:
        - name: iris
          image: ghcr.io/skkuding/codedang-iris
          resources:
            limits:
              cpu: 1
              memory: 1.5Gi
            requests:
              cpu: 1
              memory: 1.5Gi
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: false
          securityContext:
            privileged: true
          envFrom:
            - configMapRef:
                name: iris-env
            - secretRef:
                name: aws-credentials
            - secretRef:
                name: database-credentials
          env:
            - name: JUDGE_REQUEST_CONSUMER_CONNECTION_NAME
              value: iris-rejudge-consumer
            - name: JUDGE_REQUEST_QUEUE_NAME
              value: client.q.judge.rejudge
            - name: JUDGE_REQUEST_CONSUMER_TAG
              value: iris-rejudge-consumer-tag
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
