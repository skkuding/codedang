apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iris-pprof-proxy
  namespace: iris
rules:
  - apiGroups: ['']
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups: ['']
    resources:
      - pods/proxy
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iris-pprof-proxy
  namespace: iris
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iris-pprof-proxy
subjects:
  # Identity of the client certificate stored in the iris-pprof-client Secret.
  # The kube-apiserver maps the certificate CN to this User.
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: iris-pprof
