# No backend: terminate public requests without forwarding to an API service.
# Prometheus uses ClusterIP service endpoints directly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-deny
  namespace: kube-system
spec:
  parentRefs:
    - name: main-gateway
      sectionName: http
    - name: main-gateway
      sectionName: https-apex
    - name: main-gateway
      sectionName: https-wildcard
    - name: main-gateway
      sectionName: https-stage-wildcard
    - name: main-gateway
      sectionName: https-preview-wildcard
    - name: main-gateway
      sectionName: https-minio-wildcard
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/internal
        # Express routing is case-insensitive. RegularExpression support must
        # be verified when switching Gateway API implementations.
        - path:
            type: RegularExpression
            value: '(?i)^/api/internal(/|$)'
