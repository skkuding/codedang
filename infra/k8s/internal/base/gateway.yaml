apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  gatewayClassName: traefik
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 8443
    hostname: "*.codedang.com"
    tls:
      mode: Terminate
      certificateRefs:
      - name: wildcard-tls-secret
    allowedRoutes:
      namespaces:
        from: All
    # apex domain listener
  - name: https-apex
    protocol: HTTPS
    port: 8443
    hostname: "codedang.com"
    tls:
      mode: Terminate
      certificateRefs:
        - name: codedang-apex-tls
    allowedRoutes:
      namespaces:
        from: All