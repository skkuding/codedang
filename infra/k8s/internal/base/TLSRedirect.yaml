apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-api-tls-redirect
  namespace: kube-system
spec:
  parentRefs:
  - name: main-gateway
    namespace: kube-system
    sectionName: http
  hostnames:
  - "*.codedang.com"
  - codedang.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
