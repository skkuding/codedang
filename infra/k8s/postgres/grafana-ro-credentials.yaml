# grafana_ro: stage DB 의 읽기 전용 계정. Grafana 데이터소스가 reflector 로 받아 쓴다.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: grafana-ro-credentials
  namespace: postgres
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      name: grafana-ro-credentials
      namespace: postgres
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: 'monitoring-grafana'
    type: Opaque
